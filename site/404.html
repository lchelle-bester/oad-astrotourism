<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- Netlify shows this page at any address that has no page. Search engines should not list it. -->
  <meta name="robots" content="noindex">
  <title>Page not found | Astrotourism</title>
  <link rel="preload" href="/assets/fonts/space-grotesk-latin-600-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/assets/fonts/barlow-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
{{> header}}

  <main id="main" class="not-found">
    <h1 class="not-found__heading">This page isn't here yet</h1>
    <p class="not-found__text">This part of the site is still being built, or the address has changed.</p>
    <p><a class="not-found__home" href="/">Go to the home page</a></p>
  </main>

{{> to-top}}

  <script src="/js/main.js" defer></script>
</body>
</html>
