<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  {{> favicon}}
  <title>{{page.title}}</title>
  <meta name="description" content="{{page.description}}">
  <link rel="canonical" href="{{page.canonical}}">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Astrotourism">
  <meta property="og:url" content="{{page.canonical}}">
  <meta property="og:title" content="{{page.title}}">
  <meta property="og:description" content="{{page.description}}">
  <link rel="preload" href="/assets/fonts/space-grotesk-latin-600-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/assets/fonts/barlow-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
{{> header}}

  <!-- The Global Survey Report page (design in docs/survey-report/). build/survey.js counts the survey response
       documents in Sanity and writes every part: the numbers, the charts and the map are never typed. The title,
       the section headings and the unit words are fixed in build/survey.js; the editors' wording is in the
       "Global Survey Report page" document. -->
  <main id="main" class="survey">{{{page.hero}}}{{{page.body}}}{{{page.cta}}}
  </main>

{{> footer}}

{{> to-top}}

  <script src="/js/main.js" defer></script>
</body>
</html>
